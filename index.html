<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Trace Racing · v30</title>
<link rel="stylesheet" href="style.css?v=20">
<link rel="manifest" href="manifest.json?v=20">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#090c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="rotateOverlay"><div class="rotate-icon">↻</div><strong>Fordítsd el a telefont</strong><span>A Trace Racing fekvő módban játszható.</span></div>
<main class="app">
<header class="topbar">
  <div><div class="eyebrow">TRACE RACING</div><h1>Track 01 · Oval Circuit</h1></div>
  <div id="status" class="status">Indulj a zöld START kapuból</div>
</header>
<div class="race-layout">
  <section class="track-panel" id="stage">
    <canvas id="game"></canvas>
    <div id="drawTip" class="draw-tip"><b>RAJZOLD MEG A VERSENYÍVET</b><span>START → egy teljes kör → CÉL</span></div>
  </section>
  <aside class="control-panel" id="controls">
    <div class="panel-title">RACE CONTROL</div>
    <button id="raceBtn" type="button" class="btn race" disabled>VERSENY ▶</button>
    <button id="turboBtn" type="button" class="btn turbo" disabled>TURBO <span id="turboLabel">100%</span></button>
    <button id="clearBtn" type="button" class="btn clear">ÚJRARAJZOLÁS</button>
    <div class="stats">
      <div><span>SEBESSÉG</span><b id="speed">0</b><small> km/h</small></div>
      <div><span>TÁV</span><b id="distance">0</b><small> %</small></div>
      <div><span>IDŐ</span><b id="time">0.00</b><small> s</small></div>
      <div><span>ÍVPONTOK</span><b id="points">0</b></div>
    </div>
    <div class="turbo-meter"><div class="turbo-meter-fill" id="turboFill"></div></div>
    <div class="help">
      <div><i class="start"></i> START</div><div><i class="finish"></i> CÉL</div><div><i class="route"></i> saját versenyív</div>
    </div>
  </aside>
</div>
</main>
<script src="game.js?v=20"></script>
<script>
// Trace Racing update helper: always check for a newer Service Worker when the app opens.
if ("serviceWorker" in navigator) {
  let reloadedForUpdate = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloadedForUpdate) return;
    reloadedForUpdate = true;
    window.location.reload();
  });
  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("./sw.js?v=20", { updateViaCache: "none" });
      await registration.update();
    } catch (err) {
      console.warn("Service worker update check failed:", err);
    }
  });
}
</script>
</body>
</html>
